<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Sarabun, 'Noto Sans Thai', sans-serif">
  <title>แผนภาพอัลตราซาวนด์: การตั้งครรภ์นอกมดลูก</title>
  <defs>
    <filter id="sp"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9"/><feColorMatrix type="matrix" values="0 0 0 0 0.6 0 0 0 0 0.6 0 0 0 0 0.6 0 0 0 1.6 -0.55"/></filter>
    <clipPath id="fan"><path d="M210 22 L270 22 L440 300 L40 300 Z"/></clipPath>
  </defs>
  <rect width="480" height="340" fill="#050505"/>
  <g clip-path="url(#fan)">
    <rect width="480" height="340" fill="#4a4a4a"/>
    <rect width="480" height="340" filter="url(#sp)" opacity="0.9"/>
    <ellipse cx="200" cy="150" rx="78" ry="52" fill="#7a7a7a"/>
    <path d="M140 150 Q200 140 262 150" stroke="#d6d6d6" stroke-width="5" fill="none"/>
    <circle cx="330" cy="140" r="26" fill="#9a9a9a"/>
    <circle cx="330" cy="140" r="12" fill="#1a1a1a" stroke="#efefef" stroke-width="4"/>
    <path d="M90 240 Q200 290 360 236 Q300 270 200 270 Q120 270 90 240 Z" fill="#0a0a0a"/>
  </g>
  <g stroke="#7ee8ff" fill="#7ee8ff" font-size="15">
    <line x1="120" y1="60" x2="170" y2="134" stroke-width="2"/><text x="20" y="54" stroke="none" font-weight="700">มดลูก: ไม่พบถุงการตั้งครรภ์</text>
    <line x1="400" y1="80" x2="346" y2="126" stroke-width="2"/><text x="330" y="72" stroke="none">ก้อนที่ท่อนำไข่ขวา</text>
    <line x1="80" y1="300" x2="150" y2="268" stroke-width="2"/><text x="20" y="318" stroke="none">ของเหลว/เลือดในช่องท้อง (สีดำ)</text>
  </g>
  <text x="300" y="334" fill="#777" font-size="11">แผนภาพเพื่อการศึกษา</text>
</svg>
