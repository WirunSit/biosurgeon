<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Sarabun, 'Noto Sans Thai', sans-serif">
  <title>แผนภาพ MRI กระดูกสันหลังส่วนเอว: หมอนรองกระดูกเคลื่อน</title>
  <rect width="480" height="340" fill="#050505"/>
  <g fill="#6a6a6a"><rect x="150" y="20" width="90" height="56" rx="10"/><rect x="152" y="96" width="90" height="58" rx="10"/><rect x="154" y="176" width="90" height="58" rx="10"/><rect x="156" y="258" width="90" height="58" rx="10"/></g>
  <g fill="#d8d8d8"><ellipse cx="196" cy="86" rx="44" ry="8"/><ellipse cx="198" cy="165" rx="44" ry="9"/></g>
  <path d="M154 244 Q200 236 246 246 L262 250 Q270 256 258 262 L246 254 Q200 254 156 254 Z" fill="#3c3c3c"/>
  <ellipse cx="258" cy="250" rx="16" ry="10" fill="#9a9a9a"/>
  <rect x="262" y="10" width="40" height="320" fill="#e8e8e8" opacity="0.85"/>
  <path d="M262 236 Q252 250 262 264" fill="#050505"/>
  <g fill="#7a7a7a"><rect x="318" y="30" width="30" height="40" rx="6"/><rect x="320" y="110" width="30" height="40" rx="6"/><rect x="322" y="190" width="30" height="40" rx="6"/><rect x="324" y="270" width="30" height="40" rx="6"/></g>
  <g stroke="#7ee8ff" fill="#7ee8ff" font-size="15">
    <line x1="110" y1="300" x2="248" y2="256" stroke-width="2"/><text x="14" y="318" stroke="none" font-weight="700">หมอนรองกระดูกเอว 4–5 ปลิ้นไปด้านหลัง</text>
    <line x1="410" y1="200" x2="300" y2="246" stroke-width="2"/><text x="360" y="192" stroke="none">กดถุงหุ้มไขสันหลัง</text>
    <text x="360" y="212" stroke="none">และรากประสาท</text>
    <text x="14" y="30" stroke="none">หมอนรองปกติ (สว่าง = มีน้ำ)</text>
  </g>
  <text x="300" y="334" fill="#777" font-size="11">แผนภาพเพื่อการศึกษา • ภาพด้านข้าง</text>
</svg>
