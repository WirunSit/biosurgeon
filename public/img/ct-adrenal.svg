  <path d="M60 110 Q100 60 190 80 Q210 130 170 180 Q100 200 60 160 Z" fill="#8a8a8a"/>
  <circle cx="246" cy="214" r="12" fill="#bdbdbd"/><circle cx="212" cy="206" r="13" fill="#9a9a9a"/>
