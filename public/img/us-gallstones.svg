<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Sarabun, 'Noto Sans Thai', sans-serif">
  <title>แผนภาพอัลตราซาวนด์: นิ่วในถุงน้ำดี</title>
  <defs>
    <filter id="sp"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feColorMatrix type="matrix" values="0 0 0 0 0.6 0 0 0 0 0.6 0 0 0 0 0.6 0 0 0 1.6 -0.55"/></filter>
    <clipPath id="fan"><path d="M210 22 L270 22 L430 300 L50 300 Z"/></clipPath>
  </defs>
  <rect width="480" height="340" fill="#050505"/>
  <g clip-path="url(#fan)">
    <rect width="480" height="340" fill="#4a4a4a"/>
    <rect width="480" height="340" filter="url(#sp)" opacity="0.9"/>
    <path d="M40 70 Q240 58 440 70" stroke="#c8c8c8" stroke-width="5" fill="none" opacity="0.7"/>
    <ellipse cx="240" cy="170" rx="120" ry="58" fill="#e6e6e6"/>
    <ellipse cx="240" cy="170" rx="108" ry="47" fill="#0a0a0a"/>
    <g fill="#ffffff"><circle cx="232" cy="198" r="11"/><circle cx="258" cy="203" r="9"/><circle cx="210" cy="202" r="8"/></g>
    <g fill="#000" opacity="0.92"><rect x="200" y="210" width="68" height="100"/></g>
  </g>
  <g stroke="#7ee8ff" fill="#7ee8ff" font-size="15">
    <line x1="300" y1="250" x2="262" y2="208" stroke-width="2"/><text x="290" y="270" stroke="none" font-weight="700">ก้อนนิ่ว (สว่าง)</text>
    <line x1="150" y1="282" x2="205" y2="262" stroke-width="2"/><text x="40" y="292" stroke="none">เงาดำหลังก้อนนิ่ว</text>
    <line x1="120" y1="112" x2="150" y2="140" stroke-width="2"/><text x="40" y="106" stroke="none">ผนังถุงน้ำดีหนา</text>
  </g>
  <text x="14" y="26" fill="#9ad" font-size="13">RUQ • ถุงน้ำดี</text>
  <text x="14" y="330" fill="#777" font-size="11">แผนภาพเพื่อการศึกษา (ไม่ใช่ภาพอัลตราซาวนด์จริง)</text>
</svg>
