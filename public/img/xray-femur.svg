<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Sarabun, 'Noto Sans Thai', sans-serif">
  <title>แผนภาพเอกซเรย์: กระดูกต้นขาหักกลางลำ</title>
  <rect width="480" height="340" fill="#060606"/>
  <path d="M150 20 C120 120 110 220 140 330 L330 330 C350 220 350 120 320 20 Z" fill="#2b2b2b"/>
  <!-- หัวกระดูกต้นขา -->
  <circle cx="200" cy="34" r="26" fill="#cfcfcf"/>
  <path d="M206 50 L236 70 L232 160 L212 160 L214 80 Z" fill="#d9d9d9"/>
  <path d="M220 66 L230 72 L228 160 L218 160 Z" fill="#555"/>
  <!-- ชิ้นล่างเลื่อนขึ้นและเอียง -->
  <g transform="rotate(-14 246 230)">
    <path d="M232 150 L254 150 L258 320 L236 320 Z" fill="#d9d9d9"/>
    <path d="M240 152 L248 152 L250 318 L242 318 Z" fill="#555"/>
  </g>
  <path d="M212 160 L232 160" stroke="#f5f5f5" stroke-width="2"/>
  <g stroke="#7ee8ff" fill="#7ee8ff" font-size="15">
    <line x1="350" y1="120" x2="240" y2="158" stroke-width="2"/><text x="330" y="112" stroke="none" font-weight="700">กระดูกหักขวาง</text>
    <text x="330" y="132" stroke="none" font-weight="700">กลางลำกระดูก</text>
    <line x1="360" y1="210" x2="262" y2="190" stroke-width="2"/><text x="340" y="232" stroke="none">ชิ้นล่างเกยขึ้นและเอียง</text>
    <text x="340" y="252" stroke="none">(ขาจึงสั้นลง)</text>
    <line x1="80" y1="120" x2="222" y2="110" stroke-width="2"/><text x="14" y="112" stroke="none">โพรงไขกระดูก</text>
  </g>
  <text x="14" y="330" fill="#777" font-size="11">แผนภาพเพื่อการศึกษา (ไม่ใช่ภาพเอกซเรย์จริง)</text>
</svg>
