<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Sarabun, 'Noto Sans Thai', sans-serif">
  <title>แผนภาพ CT: นิ่วในท่อไตขวา</title>
  <rect width="480" height="340" fill="#050505"/>
  <ellipse cx="240" cy="175" rx="190" ry="140" fill="#3a3a3a"/>
  <ellipse cx="240" cy="175" rx="176" ry="128" fill="#555"/>
  <!-- กระดูกสันหลัง -->
  <rect x="226" y="60" width="28" height="230" rx="6" fill="#e5e5e5" opacity="0.85"/>
  <g fill="#bdbdbd" opacity="0.6"><rect x="222" y="80" width="36" height="8"/><rect x="222" y="120" width="36" height="8"/><rect x="222" y="160" width="36" height="8"/><rect x="222" y="200" width="36" height="8"/><rect x="222" y="240" width="36" height="8"/></g>
  <!-- ไตขวา (ซ้ายของภาพ) บวมน้ำ -->
  <ellipse cx="150" cy="105" rx="42" ry="62" fill="#9a9a9a"/>
  <ellipse cx="160" cy="108" rx="22" ry="34" fill="#2e2e2e"/>
  <!-- ไตซ้าย ปกติ -->
  <ellipse cx="330" cy="105" rx="38" ry="58" fill="#9a9a9a"/>
  <path d="M318 100 q8 -6 16 0" stroke="#3a3a3a" stroke-width="5" fill="none"/>
  <!-- ท่อไต -->
  <path d="M168 138 C176 170 184 190 186 214" stroke="#2e2e2e" stroke-width="12" fill="none"/>
  <path d="M186 222 C188 250 196 272 214 292" stroke="#6d6d6d" stroke-width="4" fill="none"/>
  <path d="M318 160 C306 200 296 250 268 292" stroke="#6d6d6d" stroke-width="4" fill="none"/>
  <!-- นิ่ว -->
  <circle cx="186" cy="218" r="8" fill="#ffffff"/>
  <!-- กระเพาะปัสสาวะ -->
  <ellipse cx="240" cy="300" rx="44" ry="18" fill="#3c3c3c"/>
  <g stroke="#7ee8ff" fill="#7ee8ff" font-size="15">
    <line x1="110" y1="250" x2="180" y2="222" stroke-width="2"/><text x="30" y="266" stroke="none" font-weight="700">นิ่ว 8 มม. (ขาวสว่าง)</text>
    <line x1="88" y1="40" x2="150" y2="96" stroke-width="2"/><text x="20" y="34" stroke="none">กรวยไตขวาโป่ง (บวมน้ำ)</text>
    <line x1="120" y1="190" x2="176" y2="175" stroke-width="2"/><text x="20" y="196" stroke="none">ท่อไตเหนือนิ่วโป่ง</text>
    <text x="350" y="40" stroke="none">ไตซ้ายปกติ</text>
  </g>
  <text x="14" y="330" fill="#777" font-size="11">แผนภาพเพื่อการศึกษา (ไม่ใช่ภาพ CT จริง) • ด้านขวาของผู้ป่วยอยู่ทางซ้ายของภาพ</text>
</svg>
