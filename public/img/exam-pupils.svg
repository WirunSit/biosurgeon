<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Sarabun, 'Noto Sans Thai', sans-serif">
  <title>ตรวจรูม่านตาด้วยไฟฉาย</title>
  <rect width="600" height="300" fill="#e9d5c4"/>
  <path d="M40 150 Q150 60 260 150 Q150 240 40 150 Z" fill="#fff" stroke="#8a6a55" stroke-width="4"/>
  <path d="M340 150 Q450 60 560 150 Q450 240 340 150 Z" fill="#fff" stroke="#8a6a55" stroke-width="4"/>
  <circle cx="150" cy="150" r="46" fill="#6b4a2f"/>
  <circle cx="450" cy="150" r="46" fill="#6b4a2f"/>
  <circle cx="150" cy="150" r="12" fill="#0b0b0b"/>
  <circle cx="450" cy="150" r="30" fill="#0b0b0b"/>
  <circle cx="140" cy="140" r="5" fill="#fff" opacity="0.8"/>
